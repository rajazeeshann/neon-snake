<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Modern Neon Snake</title>
<style>
:root{--cyan:#31f6ff;--pink:#ff37c7;--lime:#8cff38;--bg:#030510}*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:white}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#12235c 0,#070b20 32%,#02030b 75%)}#wrap{width:min(94vw,720px);display:grid;gap:12px}.top{display:flex;justify-content:space-between;gap:10px}.card{background:#071021cc;border:1px solid #42eaff55;border-radius:15px;padding:10px 15px;box-shadow:0 0 28px #14c9ff18;backdrop-filter:blur(9px)}.label{font-size:10px;color:#8eaabe;letter-spacing:1.6px;font-weight:800}.value{font-size:25px;font-weight:900;text-shadow:0 0 12px var(--cyan)}#gameBox{position:relative;aspect-ratio:1/1;border:1px solid #42ebff73;border-radius:22px;overflow:hidden;box-shadow:0 0 35px #15e5ff28, inset 0 0 50px #061741;background:#030714}canvas{width:100%;height:100%;display:block}.screen{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#030713d9;backdrop-filter:blur(7px);z-index:5;text-align:center}.screen.hidden{display:none}.panel{max-width:490px}h1{font-size:clamp(40px,10vw,78px);line-height:.84;margin:0;font-style:italic;background:linear-gradient(#fff 10%,var(--cyan) 50%,#686cff);background-clip:text;color:transparent;filter:drop-shadow(0 0 16px #26dfff88)}h2{font-size:42px;margin:0 0 8px;text-shadow:0 0 20px var(--pink)}p{color:#a7bfd0;line-height:1.5}button{border:0;border-radius:40px;padding:14px 28px;background:linear-gradient(90deg,var(--cyan),#9affcf);font-weight:900;color:#021017;box-shadow:0 0 22px #26eaff55;cursor:pointer}.controls{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,58px);gap:8px;justify-content:center}.ctrl{padding:0;border-radius:16px;border:1px solid #5decff55;color:white;background:#07152dcc;font-size:23px;box-shadow:inset 0 0 18px #19bfff16}.ctrl:active{background:#174069}.up{grid-column:2}.left{grid-row:2;grid-column:1}.down{grid-row:2;grid-column:2}.right{grid-row:2;grid-column:3}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.smallBtn{padding:10px 16px;background:#111b35;color:#c8f8ff;border:1px solid #3adfff55;box-shadow:none}.toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-size:22px;font-weight:1000;text-shadow:0 0 15px var(--cyan);opacity:0;transition:.2s;pointer-events:none}@media(min-width:850px) and (pointer:fine){.controls{display:none}#wrap{width:min(88vh,720px)}}
</style>
</head>
<body><main id="wrap"><section class="top"><div class="card"><div class="label">SCORE</div><div class="value" id="score">0</div></div><div class="card" style="text-align:center"><div class="label">LEVEL</div><div class="value" id="level">1</div></div><div class="card" style="text-align:right"><div class="label">BEST</div><div class="value" id="best">0</div></div></section>
<section id="gameBox"><canvas id="game"></canvas><div id="toast" class="toast"></div><div id="start" class="screen"><div class="panel"><h1>NEON<br>SNAKE</h1><p>Collect energy, grow longer, and survive as the arena accelerates. Use arrows, WASD, swipe, or the mobile controls.</p><div style="margin:14px 0"><label for="difficulty" style="display:block;margin-bottom:7px;color:#a7bfd0;font-weight:700">Select difficulty</label><select id="difficulty" style="padding:10px;border-radius:10px;background:#111b35;color:white;border:1px solid #3adfff55"><option value="easy">Easy: gentle speed increase</option><option value="normal" selected>Normal: balanced</option><option value="hard">Hard: faster acceleration</option><option value="extreme">Extreme: maximum challenge</option></select></div><button id="play">START GAME</button></div></div><div id="over" class="screen hidden"><div class="panel"><h2>GAME OVER</h2><p id="summary"></p><button id="again">PLAY AGAIN</button></div></div><div id="pause" class="screen hidden"><div class="panel"><h2>PAUSED</h2><p>Press P or tap Resume.</p><button id="resume">RESUME</button></div></div></section>
<section class="bottom"><button id="sound" class="smallBtn">🔊 Sound On</button><div class="controls"><button class="ctrl up" data-dir="up">▲</button><button class="ctrl left" data-dir="left">◀</button><button class="ctrl down" data-dir="down">▼</button><button class="ctrl right" data-dir="right">▶</button></div><button id="pauseBtn" class="smallBtn">⏸ Pause</button></section></main>
<script>
(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id),memory={};const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return Object.prototype.hasOwnProperty.call(memory,k)?memory[k]:null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){memory[k]=String(v)}}};let size=600,dpr=1,grid=24,cell=size/grid,snake,dir,nextDir,food,particles,running=false,paused=false,score=0,level=1,last=0,acc=0,difficulty='normal',soundOn=store.get('neonSnakeSound')!=='off',audio=null;let best=Number(store.get('neonSnakeBest')||0);snake=[];dir=nextDir={x:1,y:0};food={x:Math.floor(grid/2),y:Math.floor(grid/2)};particles=[];$('best').textContent=best;
function resize(){const rect=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);size=Math.floor(Math.min(rect.width,rect.height));c.width=size*dpr;c.height=size*dpr;x.setTransform(dpr,0,0,dpr,0,0);cell=size/grid}addEventListener('resize',resize);resize();
function tone(freq,dur,type='sine',vol=.05){if(!soundOn)return;if(!audio)audio=new(AudioContext||webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function spawnFood(){do{food={x:Math.floor(Math.random()*grid),y:Math.floor(Math.random()*grid)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function reset(){snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12},{x:9,y:12}];dir=nextDir={x:1,y:0};particles=[];score=0;level=1;acc=0;running=true;paused=false;spawnFood();updateHud();$('over').classList.add('hidden');$('pause').classList.add('hidden');tone(420,.08,'square',.035)}
function setDir(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(d&&!(d.x===-dir.x&&d.y===-dir.y))nextDir=d}
function step(){dir=nextDir;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=grid||h.y>=grid||snake.some(s=>s.x===h.x&&s.y===h.y)){end();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10*level;level=1+Math.floor(score/100);burst((food.x+.5)*cell,(food.y+.5)*cell);tone(520+level*32,.1,'triangle',.06);spawnFood();flash('+'+(10*level))}else snake.pop();updateHud()}
function burst(px,py){for(let i=0;i<24;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.6,r:2+Math.random()*4})}
function end(){running=false;tone(125,.45,'sawtooth',.09);if(score>best){best=score;store.set('neonSnakeBest',best);$('best').textContent=best;$('summary').innerHTML=`New high score: <b>${score}</b><br>Level reached: <b>${level}</b>`}else $('summary').innerHTML=`Score: <b>${score}</b><br>Best: <b>${best}</b>`;$('over').classList.remove('hidden')}
function updateHud(){$('score').textContent=score;$('level').textContent=level}
function flash(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(flash.t);flash.t=setTimeout(()=>$('toast').style.opacity=0,500)}
function updateParticles(dt){particles.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97});particles=particles.filter(p=>p.life>0)}
function rounded(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r);x.fill()}
function draw(t){x.clearRect(0,0,size,size);const bg=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size*.72);bg.addColorStop(0,'#0b1640');bg.addColorStop(1,'#02040d');x.fillStyle=bg;x.fillRect(0,0,size,size);x.strokeStyle='#2be8ff10';x.lineWidth=1;for(let i=0;i<=grid;i++){x.beginPath();x.moveTo(i*cell,0);x.lineTo(i*cell,size);x.stroke();x.beginPath();x.moveTo(0,i*cell);x.lineTo(size,i*cell);x.stroke()}
const pulse=1+Math.sin(t*.008)*.09,fx=(food.x+.5)*cell,fy=(food.y+.5)*cell;x.save();x.shadowBlur=28;x.shadowColor='#ff33c8';x.fillStyle='#ff53d0';x.beginPath();x.arc(fx,fy,cell*.27*pulse,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(fx-cell*.08,fy-cell*.09,cell*.055,0,Math.PI*2);x.fill();x.restore();
snake.forEach((s,i)=>{const pad=cell*(i?0.12:0.07),hue=184+i*1.7;x.save();x.shadowBlur=i?14:25;x.shadowColor=`hsl(${hue} 100% 55%)`;x.fillStyle=i?`hsl(${hue} 92% ${Math.max(40,64-i*.55)}%)`:'#82ffff';rounded(s.x*cell+pad,s.y*cell+pad,cell-pad*2,cell-pad*2,cell*.25);if(i===0){x.shadowBlur=0;x.fillStyle='#031018';const side=dir.x!==0;for(const q of [-1,1]){const ex=(s.x+.5+(side?dir.x*.2:q*.17))*cell,ey=(s.y+.5+(side?q*.17:dir.y*.2))*cell;x.beginPath();x.arc(ex,ey,cell*.055,0,Math.PI*2);x.fill()}}x.restore()});particles.forEach(p=>{x.globalAlpha=p.life/.6;x.fillStyle='#9affff';x.shadowBlur=12;x.shadowColor='#2fffff';x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill()});x.globalAlpha=1;x.shadowBlur=0}
function loop(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;if(running&&!paused){acc+=dt;const mult={easy:.75,normal:1,hard:1.35,extreme:1.8}[difficulty]||1; const interval=Math.max(.04,.15-(level-1)*(.008*mult));while(acc>=interval){acc-=interval;step()};updateParticles(dt)}draw(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
const km={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};addEventListener('keydown',e=>{if(km[e.code]){setDir(km[e.code]);e.preventDefault()}if(e.code==='KeyP'||e.code==='Space'){togglePause();e.preventDefault()}});document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();setDir(b.dataset.dir);tone(220,.025,'square',.012)})});let sx=0,sy=0;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});function togglePause(){if(!running)return;paused=!paused;$('pause').classList.toggle('hidden',!paused);tone(paused?250:440,.08,'square',.03)}$('play').onclick=()=>{difficulty=document.getElementById('difficulty').value;$('start').classList.add('hidden');reset()};$('again').onclick=reset;$('pauseBtn').onclick=togglePause;$('resume').onclick=togglePause;$('sound').onclick=()=>{soundOn=!soundOn;store.set('neonSnakeSound',soundOn?'on':'off');$('sound').textContent=soundOn?'🔊 Sound On':'🔇 Sound Off';if(soundOn)tone(600,.08,'sine',.04)};$('sound').textContent=soundOn?'🔊 Sound On':'🔇 Sound Off';document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)togglePause()});})();
</script></body></html>
